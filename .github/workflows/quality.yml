name: Verificar materiais

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links-internos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Verificar caminhos relativos
        run: python scripts/check_internal_links.py

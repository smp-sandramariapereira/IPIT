name: validate-agent

on:
  push:
  pull_request:

jobs:
  guardrails-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Validate guardrails policy and modules
        run: python scripts/validate-guardrails.py

      - name: Run guardrails tests
        run: pytest tests/test-guardrails.py -q

      - name: Run dependency consistency tests
        run: pytest tests/test-dependencies.py -q
